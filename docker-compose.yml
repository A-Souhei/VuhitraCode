# Docker Compose configuration for opencode Bridge Mode
# This configuration provides Redis as a coordination layer for opencode's Bridge Mode feature
# Bridge Mode allows multiple opencode instances to coordinate via Redis

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: opencode-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
